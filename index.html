<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #080808;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Canvas for particle field ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Center stage ── */
    .stage {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Logo mark ── */
    .logo {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 0.02em;
      user-select: none;
    }

    .logo-super {
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .logo-x {
      font-size: clamp(5rem, 18vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.85;
      background: linear-gradient(135deg, #e8ff00 0%, #aadd00 40%, #e8ff00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(232,255,0,0.5)) drop-shadow(0 0 80px rgba(232,255,0,0.2));
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards;
    }

    /* Subtle X shimmer sweep */
    @keyframes shimmer {
      0%   { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
      50%  { filter: drop-shadow(0 0 60px rgba(232,255,0,0.7)) drop-shadow(0 0 120px rgba(232,255,0,0.3)); }
      100% { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
    }

    .logo-x {
      animation:
        fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards,
        shimmer 4s ease-in-out 1.2s infinite;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Horizontal rule below logo ── */
    .rule {
      position: absolute;
      bottom: -1.2rem;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,255,0,0.3), transparent);
      opacity: 0;
      animation: fadeIn 0.6s ease 0.9s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Corner marks ── */
    .corner {
      position: fixed;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.1s forwards;
    }
    .corner--tl { top: 2rem; left: 2rem; border-top: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--tr { top: 2rem; right: 2rem; border-top: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
    .corner--bl { bottom: 2rem; left: 2rem; border-bottom: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--br { bottom: 2rem; right: 2rem; border-bottom: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="stage">
    <div class="logo">
      <span class="logo-super">Super</span>
      <span class="logo-x">X</span>
      <div class="rule"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    const COUNT = 100;
    const MOUSE = { x: -9999, y: -9999, down: false };

    // Persistent ambient particles
    let particles = [];
    // Burst particles (from clicks / drags)
    let bursts = [];
    // Ripple rings (from clicks)
    let ripples = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function mkParticle() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.4 + 0.05,
      };
    }

    function init() {
      particles = Array.from({ length: COUNT }, mkParticle);
    }

    // Spawn a burst of particles from a point
    function spawnBurst(x, y, count = 24) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const speed = Math.random() * 5 + 1.5;
        bursts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: Math.random() * 2 + 0.5,
          life: 1.0,
          decay: Math.random() * 0.02 + 0.015,
        });
      }
    }

    // Spawn a ripple ring
    function spawnRipple(x, y) {
      ripples.push({ x, y, radius: 0, maxRadius: 120, alpha: 0.6 });
    }

    // Drag trail
    let lastDrag = null;
    function onMouseMove(e) {
      MOUSE.x = e.clientX;
      MOUSE.y = e.clientY;
      if (MOUSE.down) {
        if (!lastDrag || Math.hypot(e.clientX - lastDrag.x, e.clientY - lastDrag.y) > 18) {
          spawnBurst(e.clientX, e.clientY, 5);
          lastDrag = { x: e.clientX, y: e.clientY };
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // ── Ripples ──
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.radius += 3.5;
        rp.alpha *= 0.95;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(232,255,0,${rp.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (rp.alpha < 0.01 || rp.radius > rp.maxRadius) ripples.splice(i, 1);
      }

      // ── Connections (ambient + bursts) ──
      const all = [...particles, ...bursts];
      for (let i = 0; i < all.length; i++) {
        for (let j = i + 1; j < all.length; j++) {
          const dx = all[i].x - all[j].x;
          const dy = all[i].y - all[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 110) {
            const lifeA = all[i].life ?? 1;
            const lifeB = all[j].life ?? 1;
            ctx.beginPath();
            ctx.moveTo(all[i].x, all[i].y);
            ctx.lineTo(all[j].x, all[j].y);
            ctx.strokeStyle = `rgba(232,255,0,${0.07 * (1 - dist / 110) * Math.min(lifeA, lifeB)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      // ── Burst particles ──
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.vx *= 0.94;
        b.vy *= 0.94;
        b.x += b.vx;
        b.y += b.vy;
        b.life -= b.decay;
        if (b.life <= 0) { bursts.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * b.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(232,255,0,${b.life * 0.8})`;
        ctx.fill();
      }

      // ── Ambient particles ──
      for (const p of particles) {
        const mdx = p.x - MOUSE.x;
        const mdy = p.y - MOUSE.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

        if (MOUSE.down && mdist < 180) {
          // Attract on hold
          const force = (180 - mdist) / 180 * 0.5;
          p.vx -= (mdx / mdist) * force;
          p.vy -= (mdy / mdist) * force;
        } else if (mdist < 130) {
          // Repel on hover
          const force = (130 - mdist) / 130 * 0.4;
          p.vx += (mdx / mdist) * force;
          p.vy += (mdy / mdist) * force;
        }

        p.vx *= 0.98;
        p.vy *= 0.98;
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(232,255,0,${p.alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); init(); });
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseleave', () => { MOUSE.x = -9999; MOUSE.y = -9999; });
    window.addEventListener('mousedown', e => {
      MOUSE.down = true;
      lastDrag = null;
      spawnBurst(e.clientX, e.clientY, 28);
      spawnRipple(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => { MOUSE.down = false; lastDrag = null; });

    // Touch support
    window.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      MOUSE.x = t.clientX; MOUSE.y = t.clientY;
      if (!lastDrag || Math.hypot(t.clientX - lastDrag.x, t.clientY - lastDrag.y) > 18) {
        spawnBurst(t.clientX, t.clientY, 5);
        lastDrag = { x: t.clientX, y: t.clientY };
      }
    }, { passive: false });
    window.addEventListener('touchstart', e => {
      const t = e.touches[0];
      spawnBurst(t.clientX, t.clientY, 28);
      spawnRipple(t.clientX, t.clientY);
    });

    resize();
    init();
    draw();
  </script>
</body>
</html>
