<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1f1f1f;
      --accent: #e8ff00;
      --accent-dim: rgba(232, 255, 0, 0.08);
      --text: #f0f0f0;
      --muted: #555;
      --muted2: #333;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow blob ── */
    .glow {
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse at center, rgba(232,255,0,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
      background: var(--surface);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ── Wordmark ── */
    .wordmark {
      font-size: clamp(5rem, 18vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.9;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, #ffffff 30%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }

    .wordmark .x-accent {
      background: linear-gradient(135deg, var(--accent) 0%, #c8e000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 400;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 3.5rem;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 3.5rem;
    }

    /* ── Price card ── */
    .price-card {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      background: var(--surface);
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .price-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-dim) 0%, transparent 60%);
      pointer-events: none;
    }

    .price-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .price-amount {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 40px rgba(232,255,0,0.3);
    }

    .price-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    /* ── Not interested note ── */
    .not-interested {
      font-size: 0.8rem;
      color: var(--muted2);
      font-style: italic;
      margin-bottom: 3rem;
      letter-spacing: 0.01em;
    }

    /* ── Contact ── */
    .contact-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .contact-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .contact-email {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: border-color 0.2s, background 0.2s;
    }

    .contact-email:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .contact-email svg {
      opacity: 0.5;
      flex-shrink: 0;
    }

    .contact-email:hover svg {
      opacity: 1;
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.68rem;
      color: var(--muted2);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 1;
    }

    /* ── Scanline decorations ── */
    .lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .lines span {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--border), transparent);
      opacity: 0.4;
    }

    .lines span:nth-child(1) { left: 15%; }
    .lines span:nth-child(2) { left: 35%; }
    .lines span:nth-child(3) { left: 65%; }
    .lines span:nth-child(4) { left: 85%; }
  </style>
</head>
<body>

  <div class="glow"></div>
  <div class="lines">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="wrapper">

    <div class="badge">
      <span class="badge-dot"></span>
      Domain for sale
    </div>

    <h1 class="wordmark">Super<span class="x-accent">X</span></h1>

    <p class="tagline">
      A premium domain. Short. Memorable. Yours — if the price is right.
    </p>

    <div class="divider"></div>

    <div class="price-card">
      <div class="price-label">Minimum offer</div>
      <div class="price-amount">$1,000,000</div>
      <div class="price-sub">We're not in a hurry.</div>
    </div>

    <p class="not-interested">
      Seriously though — the inbox is full of lowballs. Save us both the time.
    </p>

    <div class="contact-section">
      <span class="contact-label">Reach out</span>
      <a class="contact-email" href="mailto:fish.learn.glass@staycloaked.com">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        fish.learn.glass@staycloaked.com
      </a>
    </div>

  </div>

  <footer>superx.com &nbsp;·&nbsp; serious offers only</footer>

</body>
</html>
