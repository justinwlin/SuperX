<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperX</title>

  <!-- Open Graph (Discord, iMessage, Slack, Facebook) -->
  <meta property="og:title" content="SuperX" />
  <meta property="og:description" content="SuperX" />
  <meta property="og:image" content="https://justinwlin.github.io/SuperX/preview.png" />
  <meta property="og:url" content="https://justinwlin.github.io/SuperX/" />
  <meta property="og:type" content="website" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SuperX" />
  <meta name="twitter:description" content="SuperX" />
  <meta name="twitter:image" content="https://justinwlin.github.io/SuperX/preview.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #080808;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Canvas for particle field ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Center stage ── */
    .stage {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Logo mark ── */
    .logo {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 0.02em;
      user-select: none;
    }

    .logo-super {
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .logo-x {
      font-size: clamp(5rem, 18vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.85;
      background: linear-gradient(135deg, #e8ff00 0%, #aadd00 40%, #e8ff00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(232,255,0,0.5)) drop-shadow(0 0 80px rgba(232,255,0,0.2));
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards;
    }

    /* Subtle X shimmer sweep */
    @keyframes shimmer {
      0%   { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
      50%  { filter: drop-shadow(0 0 60px rgba(232,255,0,0.7)) drop-shadow(0 0 120px rgba(232,255,0,0.3)); }
      100% { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
    }

    .logo-x {
      animation:
        fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards,
        shimmer 4s ease-in-out 1.2s infinite;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Horizontal rule below logo ── */
    .rule {
      position: absolute;
      bottom: -1.2rem;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,255,0,0.3), transparent);
      opacity: 0;
      animation: fadeIn 0.6s ease 0.9s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Corner marks ── */
    .corner {
      position: fixed;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.1s forwards;
    }
    .corner--tl { top: 2rem; left: 2rem; border-top: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--tr { top: 2rem; right: 2rem; border-top: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
    .corner--bl { bottom: 2rem; left: 2rem; border-bottom: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--br { bottom: 2rem; right: 2rem; border-bottom: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="stage">
    <div class="logo">
      <span class="logo-super">Super</span>
      <span class="logo-x">X</span>
      <div class="rule"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // ── Mobile detection ──
    const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || window.innerWidth < 768;

    // ── DPR: cap at 1 on mobile, 2 on desktop ──
    const DPR = IS_MOBILE ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    let W, H; // CSS pixels

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width  = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildGrid();
    }

    // ── Constants — mobile gets lighter config ──
    const COUNT          = IS_MOBILE ? 30  : 60;
    const CONNECT_DIST   = IS_MOBILE ? 80  : 110;
    const CD_SQ          = CONNECT_DIST * CONNECT_DIST;
    const REPEL_SQ       = IS_MOBILE ? (90*90)  : (130*130);
    const ATTRACT_SQ     = IS_MOBILE ? (130*130) : (180*180);
    const BURST_CAP      = IS_MOBILE ? 25  : 50;
    // Skip connections entirely on mobile — biggest CPU saver
    const DRAW_CONNECTIONS = !IS_MOBILE;
    const CELL            = CONNECT_DIST; // grid cell = connection radius
    // Pre-build line alpha strings (4 bands)
    const LINE_ALPHAS    = ['rgba(232,255,0,0.03)','rgba(232,255,0,0.055)',
                            'rgba(232,255,0,0.08)','rgba(232,255,0,0.11)'];

    const MOUSE = { x: -9999, y: -9999, down: false };
    let particles = [], bursts = [], ripples = [];

    // ── Spatial grid ──
    let grid = new Map();
    let cols, rows;

    function buildGrid() {
      cols = Math.ceil(W / CELL) + 1;
      rows = Math.ceil(H / CELL) + 1;
    }

    function cellKey(cx, cy) { return cx * 10000 + cy; }

    function populateGrid() {
      grid.clear();
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const cx = (p.x / CELL) | 0;
        const cy = (p.y / CELL) | 0;
        const k = cellKey(cx, cy);
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(i);
      }
    }

    // ── Particle factory ──
    function mkParticle() {
      return {
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.4 + 0.05,
      };
    }

    function init() { particles = Array.from({ length: COUNT }, mkParticle); }

    function spawnBurst(x, y, n = 18) {
      const room = BURST_CAP - bursts.length;
      if (room <= 0) return;
      n = Math.min(n, room);
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i / n) + Math.random() * 0.4;
        const speed = Math.random() * 4 + 1.5;
        bursts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: Math.random() * 1.6 + 0.4,
          life: 1.0,
          decay: Math.random() * 0.022 + 0.018,
        });
      }
    }

    function spawnRipple(x, y) {
      if (ripples.length < 5) ripples.push({ x, y, radius: 2, alpha: 0.55 });
    }

    // ── Connection lines cached every other frame ──
    // Pre-allocate to avoid GC pressure
    const connLines = [[], [], [], []];
    const checked = new Uint8Array(COUNT * COUNT);

    function updateConnections() {
      // Clear without re-allocating
      connLines[0].length = connLines[1].length = connLines[2].length = connLines[3].length = 0;
      checked.fill(0);
      populateGrid();

      for (let i = 0; i < COUNT; i++) {
        const pi = particles[i];
        const cx = (pi.x / CELL) | 0;
        const cy = (pi.y / CELL) | 0;

        for (let dcx = -1; dcx <= 1; dcx++) {
          for (let dcy = -1; dcy <= 1; dcy++) {
            const cell = grid.get(cellKey(cx + dcx, cy + dcy));
            if (!cell) continue;
            for (let k = 0; k < cell.length; k++) {
              const j = cell[k];
              if (j <= i) continue;
              if (checked[i * COUNT + j]) continue;
              checked[i * COUNT + j] = 1;
              const pj = particles[j];
              const dx = pi.x - pj.x, dy = pi.y - pj.y;
              const dsq = dx * dx + dy * dy;
              if (dsq < CD_SQ) {
                const t = 1 - dsq / CD_SQ;
                const band = Math.min(3, (t * 4) | 0);
                connLines[band].push(pi.x, pi.y, pj.x, pj.y);
              }
            }
          }
        }
      }
    }

    // ── Main loop ──
    let lastDrag = null;
    let frameCount = 0;

    function draw() {
      frameCount++;
      ctx.clearRect(0, 0, W, H);

      const mx = MOUSE.x, my = MOUSE.y;

      // Ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.radius += 4; rp.alpha *= 0.93;
        if (rp.alpha < 0.012) { ripples.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(232,255,0,${rp.alpha.toFixed(2)})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Update ambient particles
      for (const p of particles) {
        if (!IS_MOBILE) {
          const mdx = p.x - mx, mdy = p.y - my;
          const mdsq = mdx * mdx + mdy * mdy;
          const limit = MOUSE.down ? ATTRACT_SQ : REPEL_SQ;
          if (mdsq < limit && mdsq > 1) {
            const mdist = Math.sqrt(mdsq);
            const lim = MOUSE.down ? 180 : 130;
            const force = (lim - mdist) / lim * 0.4;
            const sign = MOUSE.down ? -1 : 1;
            p.vx += sign * (mdx / mdist) * force;
            p.vy += sign * (mdy / mdist) * force;
          }
        }
        p.vx *= 0.98; p.vy *= 0.98;
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; else if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; else if (p.y > H) p.y = 0;
      }

      // Update bursts
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.vx *= 0.93; b.vy *= 0.93;
        b.x += b.vx; b.y += b.vy;
        b.life -= b.decay;
        if (b.life <= 0) bursts.splice(i, 1);
      }

      // Connections: desktop only, every 2 frames
      if (DRAW_CONNECTIONS) {
        if (frameCount % 2 === 0) updateConnections();
        ctx.lineWidth = 0.5;
        for (let b = 0; b < 4; b++) {
          const pts = connLines[b];
          if (!pts.length) continue;
          ctx.beginPath();
          ctx.strokeStyle = LINE_ALPHAS[b];
          for (let k = 0; k < pts.length; k += 4) {
            ctx.moveTo(pts[k], pts[k+1]);
            ctx.lineTo(pts[k+2], pts[k+3]);
          }
          ctx.stroke();
        }
      }

      // Draw ambient dots — all same color, one path
      ctx.fillStyle = 'rgba(232,255,0,0.35)';
      ctx.beginPath();
      for (const p of particles) {
        ctx.moveTo(p.x + p.r, p.y);
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      }
      ctx.fill();

      // Draw burst dots — single fillRect pass, no arc(), no per-frame allocation
      // Use average life for alpha; visually indistinguishable and 5× faster
      if (bursts.length) {
        let totalLife = 0;
        for (let i = 0; i < bursts.length; i++) totalLife += bursts[i].life;
        const avgAlpha = (totalLife / bursts.length * 0.85).toFixed(2);
        ctx.fillStyle = `rgba(232,255,0,${avgAlpha})`;
        for (let i = 0; i < bursts.length; i++) {
          const b = bursts[i];
          const s = b.r * b.life;
          ctx.fillRect(b.x - s, b.y - s, s * 2, s * 2);
        }
      }

      requestAnimationFrame(draw);
    }

    function onMouseMove(e) {
      MOUSE.x = e.clientX; MOUSE.y = e.clientY;
      if (MOUSE.down && (!lastDrag ||
          (e.clientX-lastDrag.x)**2 + (e.clientY-lastDrag.y)**2 > 400)) {
        spawnBurst(e.clientX, e.clientY, 4);
        lastDrag = { x: e.clientX, y: e.clientY };
      }
    }

    window.addEventListener('resize', () => { resize(); init(); });
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseleave', () => { MOUSE.x = -9999; MOUSE.y = -9999; });
    window.addEventListener('mousedown', e => {
      MOUSE.down = true; lastDrag = null;
      spawnBurst(e.clientX, e.clientY, IS_MOBILE ? 10 : 16);
      spawnRipple(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => { MOUSE.down = false; lastDrag = null; });
    if (!IS_MOBILE) {
      window.addEventListener('touchmove', e => {
        e.preventDefault();
        const t = e.touches[0];
        MOUSE.x = t.clientX; MOUSE.y = t.clientY;
        if (!lastDrag || (t.clientX-lastDrag.x)**2+(t.clientY-lastDrag.y)**2 > 900) {
          spawnBurst(t.clientX, t.clientY, 3);
          lastDrag = { x: t.clientX, y: t.clientY };
        }
      }, { passive: false });
      window.addEventListener('touchstart', e => {
        const t = e.touches[0];
        spawnBurst(t.clientX, t.clientY, 10);
        spawnRipple(t.clientX, t.clientY);
      });
    }

    resize(); init(); draw();
  </script>
</body>
</html>
