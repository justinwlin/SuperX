<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #080808;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Canvas for particle field ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Center stage ── */
    .stage {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Logo mark ── */
    .logo {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 0.02em;
      user-select: none;
    }

    .logo-super {
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .logo-x {
      font-size: clamp(5rem, 18vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.85;
      background: linear-gradient(135deg, #e8ff00 0%, #aadd00 40%, #e8ff00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(232,255,0,0.5)) drop-shadow(0 0 80px rgba(232,255,0,0.2));
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards;
    }

    /* Subtle X shimmer sweep */
    @keyframes shimmer {
      0%   { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
      50%  { filter: drop-shadow(0 0 60px rgba(232,255,0,0.7)) drop-shadow(0 0 120px rgba(232,255,0,0.3)); }
      100% { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
    }

    .logo-x {
      animation:
        fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards,
        shimmer 4s ease-in-out 1.2s infinite;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Horizontal rule below logo ── */
    .rule {
      position: absolute;
      bottom: -1.2rem;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,255,0,0.3), transparent);
      opacity: 0;
      animation: fadeIn 0.6s ease 0.9s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Corner marks ── */
    .corner {
      position: fixed;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.1s forwards;
    }
    .corner--tl { top: 2rem; left: 2rem; border-top: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--tr { top: 2rem; right: 2rem; border-top: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
    .corner--bl { bottom: 2rem; left: 2rem; border-bottom: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--br { bottom: 2rem; right: 2rem; border-bottom: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="stage">
    <div class="logo">
      <span class="logo-super">Super</span>
      <span class="logo-x">X</span>
      <div class="rule"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H;
    const COUNT = 70;          // fewer ambient particles
    const CONNECT_DIST = 100;  // connection radius
    const CONNECT_DIST_SQ = CONNECT_DIST * CONNECT_DIST;
    const MOUSE_REPEL_SQ = 130 * 130;
    const MOUSE_ATTRACT_SQ = 180 * 180;
    const BURST_CAP = 120;     // hard cap on live burst particles

    const MOUSE = { x: -9999, y: -9999, down: false };
    let particles = [];
    let bursts = [];
    let ripples = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function mkParticle() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.4 + 0.05,
      };
    }

    function init() {
      particles = Array.from({ length: COUNT }, mkParticle);
    }

    function spawnBurst(x, y, count = 20) {
      const room = BURST_CAP - bursts.length;
      if (room <= 0) return;
      count = Math.min(count, room);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const speed = Math.random() * 4.5 + 1.5;
        bursts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: Math.random() * 1.8 + 0.4,
          life: 1.0,
          decay: Math.random() * 0.022 + 0.016,
        });
      }
    }

    function spawnRipple(x, y) {
      if (ripples.length < 6) ripples.push({ x, y, radius: 0, alpha: 0.6 });
    }

    let lastDrag = null;

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // ── Ripples (cheap: just arcs) ──
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.radius += 4;
        rp.alpha *= 0.94;
        if (rp.alpha < 0.012) { ripples.splice(i, 1); continue; }
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(232,255,0,${rp.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // ── Update ambient particles ──
      const mx = MOUSE.x, my = MOUSE.y;
      for (const p of particles) {
        const mdx = p.x - mx;
        const mdy = p.y - my;
        const mdsq = mdx * mdx + mdy * mdy;

        if (mdsq < (MOUSE.down ? MOUSE_ATTRACT_SQ : MOUSE_REPEL_SQ) && mdsq > 0.01) {
          const mdist = Math.sqrt(mdsq);
          const limit = MOUSE.down ? 180 : 130;
          const force = (limit - mdist) / limit * 0.4;
          const sign = MOUSE.down ? -1 : 1;
          p.vx += sign * (mdx / mdist) * force;
          p.vy += sign * (mdy / mdist) * force;
        }

        p.vx *= 0.98; p.vy *= 0.98;
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; else if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; else if (p.y > H) p.y = 0;
      }

      // ── Update burst particles ──
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.vx *= 0.93; b.vy *= 0.93;
        b.x += b.vx; b.y += b.vy;
        b.life -= b.decay;
        if (b.life <= 0) { bursts.splice(i, 1); }
      }

      // ── Connections: ambient only, batched into one path per alpha bucket ──
      // Group lines into 4 opacity bands to minimise strokeStyle changes
      const BANDS = 4;
      const lines = Array.from({ length: BANDS }, () => []);

      for (let i = 0; i < COUNT; i++) {
        const pi = particles[i];
        for (let j = i + 1; j < COUNT; j++) {
          const pj = particles[j];
          const dx = pi.x - pj.x;
          const dy = pi.y - pj.y;
          const dsq = dx * dx + dy * dy;
          if (dsq < CONNECT_DIST_SQ) {
            const t = 1 - dsq / CONNECT_DIST_SQ; // 0..1
            const band = Math.min(BANDS - 1, (t * BANDS) | 0);
            lines[band].push(pi.x, pi.y, pj.x, pj.y);
          }
        }
      }

      for (let b = 0; b < BANDS; b++) {
        const pts = lines[b];
        if (!pts.length) continue;
        const alpha = 0.03 + b * 0.025;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(232,255,0,${alpha})`;
        ctx.lineWidth = 0.5;
        for (let k = 0; k < pts.length; k += 4) {
          ctx.moveTo(pts[k], pts[k+1]);
          ctx.lineTo(pts[k+2], pts[k+3]);
        }
        ctx.stroke();
      }

      // ── Draw ambient dots (one beginPath per unique alpha bucket) ──
      // Batch by flooring alpha to 2 decimal places
      const dotBuckets = new Map();
      for (const p of particles) {
        const key = (p.alpha * 50 | 0);
        if (!dotBuckets.has(key)) dotBuckets.set(key, { alpha: p.alpha, dots: [] });
        dotBuckets.get(key).dots.push(p.x, p.y, p.r);
      }
      for (const { alpha, dots } of dotBuckets.values()) {
        ctx.fillStyle = `rgba(232,255,0,${alpha})`;
        ctx.beginPath();
        for (let k = 0; k < dots.length; k += 3) {
          ctx.moveTo(dots[k] + dots[k+2], dots[k+1]);
          ctx.arc(dots[k], dots[k+1], dots[k+2], 0, Math.PI * 2);
        }
        ctx.fill();
      }

      // ── Draw burst dots (batch into life-buckets) ──
      if (bursts.length) {
        // Group by floored life value (0.0–1.0 → 10 buckets)
        const bBuckets = new Map();
        for (const b of bursts) {
          const key = (b.life * 10 | 0);
          if (!bBuckets.has(key)) bBuckets.set(key, { life: b.life, dots: [] });
          bBuckets.get(key).dots.push(b.x, b.y, b.r * b.life);
        }
        for (const { life, dots } of bBuckets.values()) {
          ctx.fillStyle = `rgba(232,255,0,${(life * 0.85).toFixed(2)})`;
          ctx.beginPath();
          for (let k = 0; k < dots.length; k += 3) {
            ctx.moveTo(dots[k] + dots[k+2], dots[k+1]);
            ctx.arc(dots[k], dots[k+1], dots[k+2], 0, Math.PI * 2);
          }
          ctx.fill();
        }
      }

      requestAnimationFrame(draw);
    }

    function onMouseMove(e) {
      MOUSE.x = e.clientX; MOUSE.y = e.clientY;
      if (MOUSE.down) {
        if (!lastDrag || Math.hypot(e.clientX - lastDrag.x, e.clientY - lastDrag.y) > 20) {
          spawnBurst(e.clientX, e.clientY, 4);
          lastDrag = { x: e.clientX, y: e.clientY };
        }
      }
    }

    window.addEventListener('resize', () => { resize(); init(); });
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseleave', () => { MOUSE.x = -9999; MOUSE.y = -9999; });
    window.addEventListener('mousedown', e => {
      MOUSE.down = true; lastDrag = null;
      spawnBurst(e.clientX, e.clientY, 22);
      spawnRipple(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => { MOUSE.down = false; lastDrag = null; });

    window.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      MOUSE.x = t.clientX; MOUSE.y = t.clientY;
      if (!lastDrag || Math.hypot(t.clientX - lastDrag.x, t.clientY - lastDrag.y) > 20) {
        spawnBurst(t.clientX, t.clientY, 4);
        lastDrag = { x: t.clientX, y: t.clientY };
      }
    }, { passive: false });
    window.addEventListener('touchstart', e => {
      const t = e.touches[0];
      spawnBurst(t.clientX, t.clientY, 22);
      spawnRipple(t.clientX, t.clientY);
    });

    resize(); init(); draw();
  </script>
</body>
</html>
