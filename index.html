<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #080808;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Canvas for particle field ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Center stage ── */
    .stage {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Logo mark ── */
    .logo {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 0.02em;
      user-select: none;
    }

    .logo-super {
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;
    }

    .logo-x {
      font-size: clamp(5rem, 18vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.85;
      background: linear-gradient(135deg, #e8ff00 0%, #aadd00 40%, #e8ff00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(232,255,0,0.5)) drop-shadow(0 0 80px rgba(232,255,0,0.2));
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards;
    }

    /* Subtle X shimmer sweep */
    @keyframes shimmer {
      0%   { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
      50%  { filter: drop-shadow(0 0 60px rgba(232,255,0,0.7)) drop-shadow(0 0 120px rgba(232,255,0,0.3)); }
      100% { filter: drop-shadow(0 0 30px rgba(232,255,0,0.4)) drop-shadow(0 0 60px rgba(232,255,0,0.15)); }
    }

    .logo-x {
      animation:
        fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s forwards,
        shimmer 4s ease-in-out 1.2s infinite;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Horizontal rule below logo ── */
    .rule {
      position: absolute;
      bottom: -1.2rem;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,255,0,0.3), transparent);
      opacity: 0;
      animation: fadeIn 0.6s ease 0.9s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Corner marks ── */
    .corner {
      position: fixed;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: fadeIn 0.6s ease 1.1s forwards;
    }
    .corner--tl { top: 2rem; left: 2rem; border-top: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--tr { top: 2rem; right: 2rem; border-top: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
    .corner--bl { bottom: 2rem; left: 2rem; border-bottom: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; }
    .corner--br { bottom: 2rem; right: 2rem; border-bottom: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="stage">
    <div class="logo">
      <span class="logo-super">Super</span>
      <span class="logo-x">X</span>
      <div class="rule"></div>
    </div>
  </div>

  <script>
    // ── Particle field ──
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H, particles;
    const COUNT = 90;
    const MOUSE = { x: -9999, y: -9999 };

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function init() {
      particles = Array.from({ length: COUNT }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.4 + 0.05,
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Draw connections
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(232,255,0,${0.06 * (1 - dist / 110)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      // Mouse repulsion + draw dots
      for (const p of particles) {
        // Mouse influence
        const mdx = p.x - MOUSE.x;
        const mdy = p.y - MOUSE.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mdist < 120) {
          const force = (120 - mdist) / 120 * 0.4;
          p.vx += (mdx / mdist) * force;
          p.vy += (mdy / mdist) * force;
        }

        // Dampen velocity
        p.vx *= 0.98;
        p.vy *= 0.98;

        p.x += p.vx;
        p.y += p.vy;

        // Wrap
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(232,255,0,${p.alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); init(); });
    window.addEventListener('mousemove', e => { MOUSE.x = e.clientX; MOUSE.y = e.clientY; });
    window.addEventListener('mouseleave', () => { MOUSE.x = -9999; MOUSE.y = -9999; });

    resize();
    init();
    draw();
  </script>
</body>
</html>
